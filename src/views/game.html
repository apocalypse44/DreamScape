<div id="world" aria-label="Playable procedural Dreamscape world"></div>

<header class="hud-top">
  <div class="brand"><b>D</b><span>DREAMSCAPE</span></div>
  <div class="world-clock" aria-label="World time"><span>WORLD TIME</span><time id="worldTime" datetime="09:00">09:00</time></div>
  <div class="facing"><strong id="kingdomName" class="kingdom-name" aria-live="polite">GRIMOIRE TOWER</strong><small id="placeLine">FACING N · NORTH</small></div>
  <div class="world-state"><i></i> <span id="experienceState">NEUTRAL DREAMSCAPE</span><span class="perf" id="fps" aria-label="Frame rate">--</span></div>
</header>

<div class="quest-goal leaf" id="questGoal" role="status"><small class="qg-chapter"></small><b class="qg-title"></b><span class="qg-progress"></span></div>


<div class="movement-hint" id="movementHint"><span>WASD / ARROWS</span> MOVE &nbsp;·&nbsp; <span>SHIFT</span> RUN WILD &nbsp;·&nbsp; <span>G</span> MANA SURGE</div>
<aside class="swarm-panel" id="swarmPanel">
  <div><i></i><span>VIOLET SWARM</span><strong id="swarmStatus">ROAMING</strong></div>
  <p><kbd>E</kbd> ATTRACT &nbsp; <kbd>Q</kbd> REPEL &nbsp; <kbd>F</kbd> RECALL</p>
  <small>ATTRACT CALMS THE WORLD · REPEL STIRS CHAOS</small>
  <small>LEFT / RIGHT MOUSE ALSO CONTROL THE FIELD</small>
</aside>
<!-- Not shown: area renderers (falls, ridge, Clover, Heavenly Falls) and hud.js write their hint lines here, and
     updateHUD puts the most relevant one under the kingdom name at the top (#placeLine). -->
<div class="compass" hidden></div>
<button class="escape-menu" type="button">I &nbsp; TOGGLE PANELS &nbsp; · &nbsp; ESC &nbsp; RELEASE MOUSE</button>
<div id="overlay">
  <div id="toast" aria-live="polite"></div>
  <div id="worldPrompt"></div>
</div>
<div id="chaosReadout" class="seal" role="img" aria-label="Chaos and mana">
  <svg viewBox="0 0 88 88" aria-hidden="true">
    <path class="seal-track" d="M17.13 70.87 A38 38 0 1 1 70.87 70.87"/>
    <path class="seal-chaos"/>
    <line x1="28.7" y1="13.7" x2="24.1" y2="4.6"/><line x1="66.4" y1="21.4" x2="73.2" y2="15.0"/>
    <g class="seal-mana"><path/><path/><path/><path/><path/><path/></g>
    <path class="seal-hold"/>
    <path class="seal-core" d="M44 31 L50 44 L44 57 L38 44 Z"/>
  </svg>
  <div class="seal-text"><b class="seal-mode">CALM</b><span class="seal-sub"><kbd>G</kbd><span></span></span></div>
</div>
<div class="grain" aria-hidden="true"></div>
